name: Bug report
description: Report a reproducible problem using synthetic or redacted data only
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach raw CLI output, config backups, screenshots of an authenticated admin page, HAR/PCAP files, cookies, credentials, or real network identifiers. Use only `iptime doctor` output and synthetic examples.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Redacted doctor output
      description: Paste only the output of `iptime doctor`.
      render: json
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: Version only; do not include serial numbers or network details.
  - type: textarea
    id: reproduce
    attributes:
      label: Synthetic reproduction
      description: Replace every identifier and value with clearly synthetic data.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, tokens, cookies, backups, screenshots, captures, and real network identifiers.
          required: true
